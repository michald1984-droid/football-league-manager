<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10251d">
<meta name="description" content="Twój prywatny menedżer rozgrywek piłkarskich.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/icon-192.png">
<title>Football League Manager</title>
<style>
:root{color-scheme:dark;--bg:#0c1712;--panel:#14251d;--panel2:#1b3026;--line:#2c4839;--text:#f1f7f2;--muted:#a8b9ad;--green:#4ade80;--gold:#f5c451;--red:#fb7777}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#10251d,#0b1511 55%);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}
header{padding:20px 16px 12px;max-width:980px;margin:auto}h1{font-size:clamp(24px,5vw,34px);margin:0 0 3px}h2{font-size:20px;margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.sub{color:var(--muted);font-size:13px}
main{max-width:980px;margin:auto;padding:0 14px 40px}.panel{background:rgba(20,37,29,.96);border:1px solid var(--line);border-radius:17px;padding:16px;margin:12px 0;box-shadow:0 8px 28px #0003}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{background:var(--panel2);border-radius:12px;padding:12px}.stat strong{display:block;font-size:25px}.stat span{color:var(--muted);font-size:12px}
input,select,button{font:inherit}input,select{width:100%;background:#0c1b14;border:1px solid var(--line);color:var(--text);padding:11px 12px;border-radius:10px;min-width:0}label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--green);color:#082012;font-weight:750;cursor:pointer}button.secondary{background:#263e31;color:var(--text);border:1px solid var(--line)}button.danger{background:#512929;color:#ffdede}button:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.tabs{display:flex;gap:7px;overflow:auto;padding:5px 0 10px}.tabs button{white-space:nowrap;background:#1b3026;color:var(--muted);border:1px solid var(--line);padding:9px 12px}.tabs button.active{background:var(--green);color:#082012;border-color:var(--green)}
.match{border:1px solid var(--line);border-radius:13px;padding:13px;margin:10px 0;background:#102219}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;font-weight:700}.teams .away{text-align:center}.score{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 0}.score input{width:62px;text-align:center;font-size:23px;font-weight:750;padding:8px}.prob{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center;background:#0b1912;border-radius:10px;padding:10px}.prob b{display:block;font-size:19px}.prob small{font-size:11px;color:var(--muted)}.bar{display:flex;height:8px;overflow:hidden;border-radius:20px;margin-top:8px;background:#34463b}.bar i:nth-child(1){background:#4ade80}.bar i:nth-child(2){background:#9ca3af}.bar i:nth-child(3){background:#60a5fa}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}th,td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right}th{color:var(--muted);font-size:11px}th:nth-child(2),td:nth-child(2){text-align:left}td:first-child,th:first-child{text-align:center}.tablewrap{overflow:auto}
.rounds{display:flex;gap:5px;overflow:auto;padding:6px 0 12px}.rounds button{padding:8px 11px;background:#263e31;color:var(--text);border:1px solid var(--line);flex:none}.rounds button.active{background:var(--green);color:#082012}
.pill{display:inline-block;background:#263e31;color:#c8e4d1;border-radius:99px;padding:3px 8px;font-size:11px}.good{color:var(--green)}.muted{color:var(--muted)}.formdots{display:flex;gap:5px}.dot{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;font-size:12px;font-weight:800;color:#08130c}.W{background:#4ade80}.D{background:#f5c451}.L{background:#fb7777}
canvas{width:100%;height:300px;display:block;background:#0c1b14;border-radius:12px}.notice{border-left:3px solid var(--gold);padding:9px 12px;background:#282518;color:#e9dfbd;border-radius:5px;font-size:12px}
.hidden{display:none!important}hr{border:0;border-top:1px solid var(--line)}.footer{color:var(--muted);font-size:11px;text-align:center;padding:18px}
@media(min-width:700px){main{padding-left:20px;padding-right:20px}.match{padding:16px}}
</style>
</head>
<body>
<header><h1>⚽ Football League Manager</h1><div class="sub">Twoja liga. Twój terminarz. Twoje statystyki.</div></header>
<main>
<section id="setup" class="panel">
<h2>Utwórz ligę</h2>
<label>Nazwa rozgrywek</label><input id="leagueName" value="Moja liga" maxlength="50">
<label>Nazwa sezonu</label><input id="seasonName" value="Sezon 1" maxlength="40"><label>Liczba drużyn (2–20)</label><input id="teamCount" type="number" min="2" max="20" value="6"><label>Data pierwszej kolejki</label><input id="startDate" type="date"><label>Odstęp między kolejkami (dni)</label><input id="intervalDays" type="number" min="1" max="30" value="7"><label>Kolorystyka</label><select id="themeSetup"><option value="green">Zielona</option><option value="blue">Niebieska</option><option value="red">Czerwona</option><option value="purple">Fioletowa</option></select>
<div id="teamInputs"></div>
<div class="actions" style="margin-top:14px"><button id="createBtn">Generuj terminarz</button><button class="secondary" id="restoreBtn">Wczytaj zapisany sezon</button></div>
</section>
<section id="app" class="hidden">
<div class="panel">
<div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><div><h2 id="leagueTitle">Moja liga</h2><div id="leagueMeta" class="sub"></div></div><span class="pill" id="saveStatus">Zapis lokalny</span></div>
<div class="grid" style="margin-top:12px">
<div class="stat"><strong id="playedStat">0</strong><span>Rozegrane mecze</span></div><div class="stat"><strong id="leftStat">0</strong><span>Pozostałe mecze</span></div><div class="stat"><strong id="goalsStat">0.00</strong><span>Goli na mecz</span></div>
</div>
</div>
<nav class="tabs" id="tabs">
<button data-tab="fixtures" class="active">Terminarz</button><button data-tab="table">Tabela</button><button data-tab="form">Forma</button><button data-tab="stats">Statystyki</button><button data-tab="history">Historia tabeli</button><button data-tab="simulation">Symulator</button><button data-tab="seasons">Sezony</button><button data-tab="settings">Ustawienia</button><button data-tab="backup">Zapis i kopia</button>
</nav>
<section id="view" class="panel"></section>
<div class="panel"><div class="actions"><button class="secondary" id="newLeagueBtn">Nowa liga</button><button class="danger" id="deleteBtn">Usuń zapisany sezon</button></div></div>
</section>
<div class="footer">Dane są przechowywane lokalnie w tej przeglądarce na tym urządzeniu.</div>
</main>
<script src="./app.js"></script>
</body></html>
